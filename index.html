    :root {

    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0d1322 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #universe-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Top Navigation / Stats Bar */
    header {
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(3, 4, 11, 0.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand-group h1 {
      font-size: 1.4rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff9a9e, #ffd166, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .player-title {
      font-size: 0.8rem;
      color: var(--accent-dm);
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-sm {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-sm.active {
      border-color: #48bb78;
      color: #68d391;
    }

    .dm-badge {
      background: rgba(192, 132, 252, 0.15);
      border: 1px solid var(--accent-dm);
      color: var(--accent-dm);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* Active Multiplier Bar */
    #buff-banner {
      z-index: 10;
      background: linear-gradient(90deg, #ef4444, #f59e0b);
      color: white;
      text-align: center;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: bold;
      display: none;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
    }

    /* Main Container */
    .game-container {
      display: flex;
      flex: 1;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 16px;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .game-container {
        flex-direction: column;
        align-items: center;
      }
    }

    /* Left Panel: Clicker */
    .nexus-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 300px;
      position: relative;

      margin-top: 6px;
      font-size: 0.95rem;

      justify-content: center;
      gap: 16px;

    .star-wrapper {
      position: relative;
      cursor: pointer;
      margin: 20px 0;
    }

    .star-core {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7b2 0%, #ff9800 60%, #e65100 100%);

      animation: pulse 4s infinite ease-in-out;

    .star-core:active {
      transform: scale(0.92);
      filter: brightness(1.25);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 45px #ff9800, 0 0 80px rgba(230, 81, 0, 0.5); }

    .tab-content {

    /* Upgrade Cards */

      border: 1px solid var(--border);

    .upgrade-card:hover:not(.disabled) {

      border-color: rgba(255, 209, 102, 0.5);

    .upgrade-card.disabled {

    .card-left {
      display: flex;
      align-items: center;

    .card-icon {

    .card-title {

    .card-subtitle {

      font-weight: bold;

    /* Toast Notification */

      bottom: 20px;

  <script>
    // --- PROCEDURAL WEB AUDIO SYNTHESIZER ---
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'tap') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320 + Math.random() * 80, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'buy') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(659.25, now + 0.07);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'event') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'fanfare') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.15, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.25);
        });
      } else if (type === 'crunch') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.9);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.9);
      }
    }
